<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanta Yamauchi | Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body class="home">
    <nav class="home-nav" aria-label="Main navigation">
      <a href="index.html" aria-current="page">Works</a>
      <a href="about.html">About</a>
      <a href="career.html">Career</a>
      <a href="access.html">Access</a>
    </nav>

    <main>
      <section class="hero" aria-label="制作物一覧">
        <div class="marquee" aria-label="制作物一覧">
          <div class="track" data-track></div>
        </div>
      </section>
    </main>

    <div class="modal" data-modal hidden>
      <div class="modal-backdrop" data-close></div>
      <section
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button
          class="modal-close"
          type="button"
          data-close
          aria-label="閉じる"
        >
          Close
        </button>
        <p class="modal-index" data-modal-index></p>
        <h2 id="modal-title" data-modal-title></h2>
        <p class="modal-kind" data-modal-kind></p>
        <p class="modal-description" data-modal-description></p>
        <dl class="modal-meta">
          <div>
            <dt>Role</dt>
            <dd data-modal-role></dd>
          </div>
          <div>
            <dt>Tools</dt>
            <dd data-modal-tools></dd>
          </div>
        </dl>
      </section>
    </div>
  </body>
</html>
